server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/yesulin_access.log yesulin;
    error_log /var/log/nginx/yesulin_error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /api/v1/ {
        include /etc/nginx/snippets/yesulin-origin-guard.conf;
        include /etc/nginx/snippets/yesulin-spring-proxy.conf;
    }

    location ^~ /oauth2/ {
        include /etc/nginx/snippets/yesulin-origin-guard.conf;
        include /etc/nginx/snippets/yesulin-spring-proxy.conf;
    }

    location ^~ /login/oauth2/ {
        include /etc/nginx/snippets/yesulin-origin-guard.conf;
        include /etc/nginx/snippets/yesulin-spring-proxy.conf;
    }

    location / {
        return 404;
    }
}
