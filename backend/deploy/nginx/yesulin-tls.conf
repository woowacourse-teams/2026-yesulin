server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name origin.yesulin.art;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name origin.yesulin.art;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/origin.yesulin.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.yesulin.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:yesulin_tls:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/yesulin_access.log yesulin;
    error_log /var/log/nginx/yesulin_error.log warn;

    location ^~ /api/v1/ {
        include /etc/nginx/snippets/yesulin-origin-guard.conf;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
