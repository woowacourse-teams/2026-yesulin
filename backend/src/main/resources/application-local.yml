spring:
  config:
    # 로컬 실행은 config submodule 안의 개인 환경 파일이 없으면 시작하지 않는다.
    import: file:../config/server/local.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:yesulin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:yesulin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/local

yesulin:
  storage:
    s3:
      bucket: ${YESULIN_STORAGE_S3_BUCKET:yesulin-local}
      key-prefix: ${YESULIN_STORAGE_S3_KEY_PREFIX:yesulin}
      public-base-url: ${YESULIN_STORAGE_S3_PUBLIC_BASE_URL:http://localhost:4566/yesulin-local/yesulin/public}
