spring:
  application:
    name: yesulin
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

yesulin:
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      upload-expiration: ${YESULIN_STORAGE_S3_UPLOAD_EXPIRATION:PT10M}
      download-expiration: ${YESULIN_STORAGE_S3_DOWNLOAD_EXPIRATION:PT10M}
