spring:
  config:
    import:
      - optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: yesulin
  lifecycle:
    # systemd TimeoutStopSec(30s) 안에 진행 중인 요청을 마칠 시간을 준다.
    timeout-per-shutdown-phase: 25s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_SMTP_USERNAME:}
    password: ${GOOGLE_SMTP_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  # ALB에서 대상을 제거한 뒤 종료할 때 진행 중인 요청을 정상 종료한다.
  shutdown: graceful
  # ALB가 설정하는 X-Forwarded-* 헤더를 외부 HTTPS 요청 정보로 반영한다.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:12h}
      cookie:
        http-only: true
        same-site: lax
        # 로컬은 http라 기본값 false다. 배포 환경에서 true로 켠다.
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  file:
    name: ${LOG_FILE:logs/yesulin.log}
  pattern:
    # journal과 로컬 터미널은 빠르게 읽을 수 있게 thread를 빼고 source 길이를 줄인다.
    console: "%d{HH:mm:ss.SSS, Asia/Seoul} %-5level [requestId=%X{requestId:-}] %logger{24} - %msg%n"
  structured:
    format:
      # 관리 API와 향후 중앙 수집기가 한 줄을 한 이벤트로 안전하게 읽는다.
      file: logstash
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE:logs/yesulin.log}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:14}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}

management:
  endpoints:
    web:
      # ALB에는 health endpoint만 노출한다.
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # 애플리케이션이 요청을 받을 수 있고 DB도 접속 가능해야 ready로 판정한다.
        readiness:
          include: readinessState,db

yesulin:
  admin:
    # 운영 대시보드 계정. `email:password` 형식이고 여러 개는 쉼표로 잇는다. 비우면 계정을 만들지 않는다.
    accounts: ${YESULIN_ADMIN_ACCOUNTS:}
    # 지원서 삭제 2차 확인 비밀번호의 BCrypt 해시다. 원문 비밀번호를 설정하거나 저장소에 기록하지 않는다.
    deletion-password-hash: ${YESULIN_ADMIN_DELETION_PASSWORD_HASH:}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${GOOGLE_SMTP_FROM:}
  email-verification:
    expiration: ${EMAIL_VERIFICATION_EXPIRATION:PT5M}
    url: ${EMAIL_VERIFICATION_URL:http://localhost:8080/api/v1/auth/email-verifications}
    redirect-uri: ${EMAIL_VERIFICATION_REDIRECT_URI:http://localhost:3000/producers}
  password-reset:
    expiration: ${PASSWORD_RESET_EXPIRATION:PT5M}
    url: ${PASSWORD_RESET_URL:http://localhost:3000/forgot-password}
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      upload-expiration: ${YESULIN_STORAGE_S3_UPLOAD_EXPIRATION:PT10M}
      download-expiration: ${YESULIN_STORAGE_S3_DOWNLOAD_EXPIRATION:PT10M}
  social-login:
    enabled: ${SOCIAL_LOGIN_ENABLED:true}
    redirect-uri: ${SOCIAL_LOGIN_REDIRECT_URI:}
    success-redirect: ${SOCIAL_LOGIN_SUCCESS_REDIRECT:/}
    failure-redirect: ${SOCIAL_LOGIN_FAILURE_REDIRECT:}
    providers:
      kakao:
        issuer: https://kauth.kakao.com
        authorization-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
        client-id: ${KAKAO_OIDC_CLIENT_ID:}
        client-secret: ${KAKAO_OIDC_CLIENT_SECRET:}
      naver:
        issuer: https://nid.naver.com
        authorization-uri: https://nid.naver.com/oauth2/authorize
        token-uri: https://nid.naver.com/oauth2/token
        jwk-set-uri: https://nid.naver.com/oauth2/jwks
        client-id: ${NAVER_OIDC_CLIENT_ID:}
        client-secret: ${NAVER_OIDC_CLIENT_SECRET:}
      google:
        issuer: https://accounts.google.com
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        client-id: ${GOOGLE_OIDC_CLIENT_ID:}
        client-secret: ${GOOGLE_OIDC_CLIENT_SECRET:}
