spring:
  config:
    import:
      - optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: yesulin
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        # 로컬은 http라 기본값 false다. 배포 환경에서 true로 켠다.
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  file:
    name: ${LOG_FILE:logs/yesulin.log}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId:-}] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId:-}] %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE:logs/yesulin.log}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:14}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}

yesulin:
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      upload-expiration: ${YESULIN_STORAGE_S3_UPLOAD_EXPIRATION:PT10M}
  social-login:
    enabled: ${SOCIAL_LOGIN_ENABLED:true}
    redirect-uri: ${SOCIAL_LOGIN_REDIRECT_URI:}
    success-redirect: ${SOCIAL_LOGIN_SUCCESS_REDIRECT:/}
    providers:
      kakao:
        issuer: https://kauth.kakao.com
        authorization-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
        client-id: ${KAKAO_OIDC_CLIENT_ID:}
        client-secret: ${KAKAO_OIDC_CLIENT_SECRET:}
      naver:
        issuer: https://nid.naver.com
        authorization-uri: https://nid.naver.com/oauth2/authorize
        token-uri: https://nid.naver.com/oauth2/token
        jwk-set-uri: https://nid.naver.com/oauth2/jwks
        client-id: ${NAVER_OIDC_CLIENT_ID:}
        client-secret: ${NAVER_OIDC_CLIENT_SECRET:}
      google:
        issuer: https://accounts.google.com
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        client-id: ${GOOGLE_OIDC_CLIENT_ID:}
        client-secret: ${GOOGLE_OIDC_CLIENT_SECRET:}
