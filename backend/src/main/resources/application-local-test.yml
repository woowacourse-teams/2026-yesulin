spring:
  datasource:
    url: jdbc:h2:mem:yesulin;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

yesulin:
  storage:
    s3:
      bucket: yesulin-local
      key-prefix: yesulin
      public-base-url: http://localhost:4566
      region: ap-northeast-2
      upload-expiration: PT10M
