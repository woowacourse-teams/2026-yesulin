server:
  address: 127.0.0.1
  port: 8093
spring:
  datasource:
    url: jdbc:h2:file:./build/pdf-extraction-local/database;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  session:
    jdbc:
      initialize-schema: always
yesulin:
  notice:
    link-base-url: http://127.0.0.1:3201
    scheduler-enabled: false
  timetable:
    link-base-url: http://127.0.0.1:3201
  slack:
    notice-webhook-url: ""
    timetable-webhook-url: ""
    error-webhook-url: ""
  pdf-extraction:
    enabled: true
    local-endpoint: http://localhost:4568
  storage:
    s3:
      bucket: yesulin-pdf-local
      key-prefix: yesulin/local
      public-base-url: http://localhost:4568/yesulin-pdf-local/yesulin/local/public
  mail:
    enabled: false
  social-login:
    enabled: false
