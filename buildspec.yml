version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend"
      - chmod +x gradlew
      - ./gradlew build --no-daemon

  post_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend"
      - sh deploy/tests/validate_service_test.sh
      - sh deploy/tests/cleanup_releases_test.sh
      - chmod +x deploy/package_bundle.sh
      - deploy/package_bundle.sh "$CODEBUILD_RESOLVED_SOURCE_VERSION"

artifacts:
  base-directory: backend/build/deployment
  files:
    - '**/*'
  discard-paths: no

# 컨테이너는 매 빌드마다 새로 뜨므로 Gradle 배포판과 의존성을 캐시하지 않으면
# 빌드마다 전부 다시 내려받는다. CodeBuild 프로젝트에서 캐시 유형을 S3로
# 지정해야 실제로 동작한다.
cache:
  paths:
    - '/root/.gradle/caches/**/*'
    - '/root/.gradle/wrapper/**/*'
