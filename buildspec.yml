version: 0.2

# Gradle 홈을 명시해 buildspec의 cache 경로와 항상 일치시킨다.
# 빌드 이미지가 바뀌어 기본 HOME이 달라져도 캐시가 조용히 어긋나지 않는다.
env:
  variables:
    GRADLE_USER_HOME: /root/.gradle

phases:
  install:
    runtime-versions:
      java: corretto25

  pre_build:
    commands:
      # CodePipeline Build 액션의 CONFIG_COMMIT_ID는 #{ConfigVariables.CommitId}로 전달한다.
      # CodeBuild 프로젝트 단독 실행에는 이 값이 없으므로 검증 단계에서 실패한다.
      - sh "$CODEBUILD_SRC_DIR/scripts/config/verify-build-source.sh"

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend"
      - chmod +x gradlew
      # 여기서는 검증하지 않고 실행 JAR만 만든다.
      # Checkstyle과 테스트는 PR 단계의 GitHub Actions가 담당하며,
      # main ruleset이 CI 통과와 최신 브랜치를 강제해 검증을 거치지 않은
      # 코드가 main에 들어오지 못하게 막는다.
      # ruleset이 해제되면 이 명령을 build로 되돌려야 한다.
      # task output cache는 새 CodeBuild 컨테이너에서 다음 빌드로 이어지지 않으므로 생성하지 않는다.
      - ./gradlew bootJar --no-daemon --no-build-cache

  post_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend"
      - sh deploy/tests/check_flyway_migration_order_test.sh
      - sh deploy/tests/validate_service_test.sh
      - sh deploy/tests/cleanup_releases_test.sh
      - sh deploy/tests/install_env_test.sh
      - sh deploy/tests/buildspec_cache_test.sh
      # 다음 빌드에서 S3 캐시 효과와 전송 비용을 비교할 수 있도록 저장 대상 크기를 남긴다.
      - du -sh /root/.gradle/caches/modules-2 /root/.gradle/wrapper
      - chmod +x deploy/package_bundle.sh
      - deploy/package_bundle.sh "$CODEBUILD_RESOLVED_SOURCE_VERSION" "$CODEBUILD_SRC_DIR_ConfigSource/server/staging.env"

artifacts:
  base-directory: backend/build/deployment
  files:
    - '**/*'
  discard-paths: no

# 컨테이너는 매 빌드마다 새로 뜨므로 Gradle 배포판과 의존성만 S3에 보존한다.
# 전체 caches 디렉터리는 task output과 변환 결과까지 포함해 전송량이 빌드 비용보다 커질 수 있다.
# CodeBuild 프로젝트에서 캐시 유형을 S3로 지정해야 실제로 동작한다.
cache:
  paths:
    - '/root/.gradle/caches/modules-2/**/*'
    - '/root/.gradle/wrapper/**/*'
