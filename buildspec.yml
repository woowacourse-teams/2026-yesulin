version: 0.2

# Gradle 홈을 명시해 buildspec의 cache 경로와 항상 일치시킨다.
# 빌드 이미지가 바뀌어 기본 HOME이 달라져도 캐시가 조용히 어긋나지 않는다.
env:
  variables:
    GRADLE_USER_HOME: /root/.gradle

phases:
  install:
    runtime-versions:
      java: corretto25

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend"
      - chmod +x gradlew
      # 여기서는 검증하지 않고 실행 JAR만 만든다.
      # Checkstyle과 테스트는 PR 단계의 GitHub Actions가 담당하며,
      # main ruleset이 CI 통과와 최신 브랜치를 강제해 검증을 거치지 않은
      # 코드가 main에 들어오지 못하게 막는다.
      # ruleset이 해제되면 이 명령을 build로 되돌려야 한다.
      - ./gradlew bootJar --no-daemon

  post_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend"
      - sh deploy/tests/check_flyway_migration_order_test.sh
      - sh deploy/tests/validate_service_test.sh
      - sh deploy/tests/cleanup_releases_test.sh
      - sh deploy/tests/migrate_legacy_public_files_test.sh
      - sh deploy/tests/nginx_oauth_routes_test.sh
      - chmod +x deploy/package_bundle.sh
      - deploy/package_bundle.sh "$CODEBUILD_RESOLVED_SOURCE_VERSION"

artifacts:
  base-directory: backend/build/deployment
  files:
    - '**/*'
  discard-paths: no

# 컨테이너는 매 빌드마다 새로 뜨므로 Gradle 배포판과 의존성을 캐시하지 않으면
# 빌드마다 전부 다시 내려받는다. CodeBuild 프로젝트에서 캐시 유형을 S3로
# 지정해야 실제로 동작한다.
cache:
  paths:
    - '/root/.gradle/caches/**/*'
    - '/root/.gradle/wrapper/**/*'
