name: Slack GitHub Notifications

on:
  # 수동 테스트
  workflow_dispatch:

  # Issue 관련 이벤트
  issues:
    types:
      - opened
      - edited
      - deleted
      - transferred
      - pinned
      - unpinned
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - locked
      - unlocked
      - milestoned
      - demilestoned
      - typed
      - untyped
      - field_added
      - field_removed

  # Pull Request 관련 이벤트
  pull_request:
    types:
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - converted_to_draft
      - ready_for_review
      - review_requested
      - review_request_removed
      - locked
      - unlocked
      - milestoned
      - demilestoned
      - enqueued
      - dequeued
      - auto_merge_enabled
      - auto_merge_disabled

# GitHub Repository를 수정할 필요가 없으므로 권한 제거
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send GitHub notification to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request


          # --------------------------------------------------
          # 공통 Slack 메시지
          # --------------------------------------------------
          def create_message(status, number, title, url, details):
              return {
                  # 모바일 푸시 등에서 사용되는 fallback text
                  "text": f"{status} - #{number} {title}",

                  "blocks": [
                      # 이벤트 상태
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": f"*{status}*"
                          }
                      },

                      # Issue / PR 제목
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": f"*<{url}|#{number} {title}>*"
                          }
                      },

                      # 작성자 / 요청자 / 브랜치 등의 상세 정보
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": details
                          }
                      }
                  ]
              }


          # --------------------------------------------------
          # GitHub Actions 환경 정보
          # --------------------------------------------------
          event_name = os.environ["GITHUB_EVENT_NAME"]
          actor = os.environ["GITHUB_ACTOR"]
          repository = os.environ["GITHUB_REPOSITORY"]

          with open(
              os.environ["GITHUB_EVENT_PATH"],
              encoding="utf-8"
          ) as f:
              event = json.load(f)


          # --------------------------------------------------
          # 수동 테스트
          # --------------------------------------------------
          if event_name == "workflow_dispatch":
              payload = {
                  "text": "GitHub → Slack 연결 테스트 성공",
                  "blocks": [
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "✅ *Slack Notification Test*"
                          }
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": f"Repository: `{repository}`"
                          }
                      }
                  ]
              }


          # --------------------------------------------------
          # Issue 이벤트
          # --------------------------------------------------
          elif event_name == "issues":
              issue = event["issue"]
              action = event["action"]

              issue_actions = {
                  "opened": "🟢 Issue Opened",
                  "edited": "Issue Edited",
                  "deleted": "Issue Deleted",
                  "transferred": "Issue Transferred",

                  "closed": "⚫ Issue Closed",
                  "reopened": "🔵 Issue Reopened",

                  "assigned": "Issue Assigned",
                  "unassigned": "Issue Unassigned",

                  "labeled": "Issue Labeled",
                  "unlabeled": "Issue Unlabeled",

                  "pinned": "Issue Pinned",
                  "unpinned": "Issue Unpinned",

                  "locked": "Issue Locked",
                  "unlocked": "Issue Unlocked",

                  "milestoned": "Issue Milestoned",
                  "demilestoned": "Issue Demilestoned",

                  "typed": "Issue Type Changed",
                  "untyped": "Issue Type Removed",

                  "field_added": "Issue Field Updated",
                  "field_removed": "Issue Field Removed",
              }

              status = issue_actions.get(
                  action,
                  f"Issue {action}"
              )

              # 생성 이벤트는 실제 작성자,
              # 그 외 이벤트는 해당 동작을 수행한 사람을 보여준다.
              if action == "opened":
                  details = (
                      f"*작성자:* `{issue['user']['login']}`"
                  )
              else:
                  details = (
                      f"*처리자:* `{actor}`"
                  )

              payload = create_message(
                  status=status,
                  number=issue["number"],
                  title=issue["title"],
                  url=issue["html_url"],
                  details=details
              )


          # --------------------------------------------------
          # Pull Request 이벤트
          # --------------------------------------------------
          elif event_name == "pull_request":
              pr = event["pull_request"]
              action = event["action"]

              # GitHub에서 PR Merge는
              # closed 이벤트 + merged == true 로 판단한다.
              if action == "closed" and pr.get("merged"):
                  status = "✅ PR Merged"

                  merged_by = (
                      (pr.get("merged_by") or {}).get("login")
                      or actor
                  )

                  user_line = (
                      f"*병합자:* `{merged_by}`"
                  )

              else:
                  pr_actions = {
                      "opened": "🟣 PR Opened",
                      "edited": "PR Edited",

                      "closed": "⚫ PR Closed",
                      "reopened": "🔵 PR Reopened",

                      "synchronize": "PR Updated",

                      "assigned": "PR Assigned",
                      "unassigned": "PR Unassigned",

                      "labeled": "PR Labeled",
                      "unlabeled": "PR Unlabeled",

                      "converted_to_draft": "PR Draft",
                      "ready_for_review": "PR Ready for Review",

                      "review_requested": "Review Requested",
                      "review_request_removed": "Review Request Removed",

                      "locked": "PR Locked",
                      "unlocked": "PR Unlocked",

                      "milestoned": "PR Milestoned",
                      "demilestoned": "PR Demilestoned",

                      "enqueued": "PR Merge Queue Added",
                      "dequeued": "PR Merge Queue Removed",

                      "auto_merge_enabled": "Auto Merge Enabled",
                      "auto_merge_disabled": "Auto Merge Disabled",
                  }

                  status = pr_actions.get(
                      action,
                      f"PR {action}"
                  )

                  if action == "opened":
                      user_line = (
                          f"*요청자:* `{pr['user']['login']}`"
                      )
                  else:
                      user_line = (
                          f"*처리자:* `{actor}`"
                      )

              branch_line = (
                  f"*브랜치:* `{pr['head']['ref']}`"
                  f" → "
                  f"`{pr['base']['ref']}`"
              )

              # 줄바꿈해서 표시
              details = (
                  f"{user_line}\n"
                  f"{branch_line}"
              )

              payload = create_message(
                  status=status,
                  number=pr["number"],
                  title=pr["title"],
                  url=pr["html_url"],
                  details=details
              )


          else:
              raise SystemExit(0)


          # --------------------------------------------------
          # Slack Incoming Webhook으로 전송
          # --------------------------------------------------
          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST",
          )

          with urllib.request.urlopen(request) as response:
              print(
                  f"Slack notification sent: HTTP {response.status}"
              )

          PY