jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BENCHMARK_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source SHA
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = "$BENCHMARK_SHA"
          echo "tested_sha=$BENCHMARK_SHA"

      - name: Select changes (selective)
        id: changes
        working-directory: .
        run: |
          python3 -B - <<'PY_SELECTOR'
          import fnmatch
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path


          CHECKS = {"frontend", "backend"}
          SCOPES = {"frontend": {"frontend"}, "backend": {"backend"}, "both": CHECKS, "none": set()}
          ROOT = Path.cwd()


          def load_rules(path):
              rules = json.loads(path.read_text(encoding="utf-8"))["rules"]
              patterns = [pattern for rule in rules for pattern in rule["paths"]]
              if not rules or set(rule["run"] for rule in rules) != SCOPES.keys():
                  raise ValueError("Rules must declare frontend, backend, both and none")
              if any(not pattern or pattern.startswith(("/", "*")) for pattern in patterns):
                  raise ValueError("Each rule pattern must begin with a repository path")
              if len(patterns) != len(set(patterns)):
                  raise ValueError("Duplicate path pattern")
              return rules


          def scope_for(path, rules):
              for rule in rules:
                  if any(fnmatch.fnmatchcase(path, pattern) for pattern in rule["paths"]):
                      return rule["run"]
              return None


          def classify(paths, rules):
              scopes = {path: scope_for(path, rules) for path in paths}
              unknown = [path for path, scope in scopes.items() if scope is None]
              if unknown:
                  raise ValueError(f"Unclassified paths. Update .github/ci-paths.json: {json.dumps(unknown, ensure_ascii=True)}")
              return set().union(*(SCOPES[scope] for scope in scopes.values()))


          def git(*args):
              return subprocess.check_output(["git", *args], cwd=ROOT)


          def require_sha(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise ValueError("Expected a full Git commit SHA")
              return value


          def comparison(event_name, payload, head):
              if event_name == "pull_request":
                  pr = payload["pull_request"]
                  return require_sha(pr["base"]["sha"]), require_sha(pr["head"]["sha"]), "selective"
              if event_name == "push" and payload["after"] == head:
                  return require_sha(payload["before"]), None, "selective"
              if event_name == "workflow_dispatch":
                  inputs = payload["inputs"]
                  if inputs["mode"] in {"full", "selective"}:
                      return require_sha(inputs["base_sha"]), None, inputs["mode"]
              raise ValueError("Unrecognized CI event or inconsistent commit metadata")


          def ensure_base(base):
              exists = subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], cwd=ROOT, stderr=subprocess.DEVNULL)
              if exists.returncode:
                  git("fetch", "--no-tags", "--depth=1", "origin", base)
              git("cat-file", "-e", f"{base}^{{commit}}")


          def changed_paths(base, head, pr_head=None, *, allow_initial_push=False):
              if pr_head and git("show", "-s", "--format=%P", head).decode().split() != [base, pr_head]:
                  raise ValueError("PR merge commit does not match event base and head")
              if base == "0" * 40 and allow_initial_push:
                  return decode_paths(git("ls-tree", "-rz", "--name-only", head))
              ensure_base(base)
              return decode_paths(git("diff", "--name-only", "-z", "--no-renames", "--ignore-submodules=none", base, head, "--"))


          def decode_paths(output):
              return [os.fsdecode(path) for path in output.split(b"\0") if path]


          def write_result(mode, selected, paths, base, head):
              active = selected.copy()
              if mode == "full":
                  active.update(CHECKS)
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  for check in sorted(CHECKS):
                      print(f"{check}={str(check in active).lower()}", file=output)
              needed = ", ".join(sorted(selected)) or "none"
              executed = ", ".join(sorted(active)) or "none"
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  print(f"### CI paths\n\n- Mode: `{mode}`\n- Range: `{base}` → `{head}`", file=summary)
                  print(f"- Changed paths: {len(paths)}\n- Selected: {needed}\n- Run: {executed}", file=summary)



          base = require_sha(os.environ['BENCHMARK_BASE'])
          head = require_sha(os.environ['BENCHMARK_SHA'])
          pr_head = require_sha(os.environ['BENCHMARK_PR_HEAD'])
          paths = changed_paths(base, head, pr_head)
          rules = json.loads('{\n  "rules": [\n    {\n      "run": "both",\n      "paths": [\n        ".gitattributes",\n        ".github/ci-paths.json",\n        ".github/workflows/ci.yml",\n        "scripts/ci/**"\n      ]\n    },\n    {\n      "run": "none",\n      "paths": [\n        ".env.example",\n        ".github/ISSUE_TEMPLATE/**",\n        ".github/pull_request_template.md",\n        ".github/workflows/slack-notification.yml",\n        ".gitmodules",\n        ".husky/**",\n        "AGENTS.md",\n        "CLAUDE.md",\n        "README.md",\n        "backend/AGENTS.md",\n        "backend/README.md",\n        "backend/docs/**.md",\n        "buildspec.yml",\n        "commitlint.config.cjs",\n        "compose.yaml",\n        "config",\n        "config-version.txt",\n        "design/**",\n        "docs/**",\n        "evidence.md",\n        "ops/backup/**",\n        "ops/configure/**",\n        "ops/diagnose/**",\n        "ops/loadtest/**",\n        "ops/monitor/app.sh",\n        "ops/monitor/cloudwatch/install_database.sh",\n        "ops/monitor/cloudwatch/systemd/**",\n        "ops/monitor/database.sh",\n        "ops/pdf-extraction-lambda/**",\n        "ops/recover/**",\n        "output/pdf/**",\n        "scripts/config/compare-env-keys.sh",\n        "scripts/config/sync.sh",\n        "scripts/config/tests/compare_env_keys_test.sh",\n        "scripts/config/validate-pin.sh",\n        "scripts/run-checkstyle.mjs"\n      ]\n    },\n    {\n      "run": "frontend",\n      "paths": [".gitignore", ".nvmrc", "frontend/**", "package-lock.json", "package.json"]\n    },\n    {\n      "run": "backend",\n      "paths": [\n        "backend/**",\n        "ops/monitor/cloudwatch/database_metrics.py",\n        "ops/monitor/cloudwatch/queries.json",\n        "ops/monitor/cloudwatch/tests/**",\n        "ops/monitor/cloudwatch/update_dashboards.py",\n        "scripts/config/tests/deploy_env_test.sh",\n        "scripts/config/verify-build-source.sh"\n      ]\n    }\n  ]\n}\n')['rules']
          selected = classify(paths, rules)
          print('selected=' + ','.join(sorted(selected)))
          write_result('selective', selected, paths, base, head)
          PY_SELECTOR

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Run frontend lint
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BENCHMARK_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source SHA
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = "$BENCHMARK_SHA"
          echo "tested_sha=$BENCHMARK_SHA"

      - name: Select changes (selective)
        id: changes
        working-directory: .
        run: |
          python3 -B - <<'PY_SELECTOR'
          import fnmatch
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path


          CHECKS = {"frontend", "backend"}
          SCOPES = {"frontend": {"frontend"}, "backend": {"backend"}, "both": CHECKS, "none": set()}
          ROOT = Path.cwd()


          def load_rules(path):
              rules = json.loads(path.read_text(encoding="utf-8"))["rules"]
              patterns = [pattern for rule in rules for pattern in rule["paths"]]
              if not rules or set(rule["run"] for rule in rules) != SCOPES.keys():
                  raise ValueError("Rules must declare frontend, backend, both and none")
              if any(not pattern or pattern.startswith(("/", "*")) for pattern in patterns):
                  raise ValueError("Each rule pattern must begin with a repository path")
              if len(patterns) != len(set(patterns)):
                  raise ValueError("Duplicate path pattern")
              return rules


          def scope_for(path, rules):
              for rule in rules:
                  if any(fnmatch.fnmatchcase(path, pattern) for pattern in rule["paths"]):
                      return rule["run"]
              return None


          def classify(paths, rules):
              scopes = {path: scope_for(path, rules) for path in paths}
              unknown = [path for path, scope in scopes.items() if scope is None]
              if unknown:
                  raise ValueError(f"Unclassified paths. Update .github/ci-paths.json: {json.dumps(unknown, ensure_ascii=True)}")
              return set().union(*(SCOPES[scope] for scope in scopes.values()))


          def git(*args):
              return subprocess.check_output(["git", *args], cwd=ROOT)


          def require_sha(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise ValueError("Expected a full Git commit SHA")
              return value


          def comparison(event_name, payload, head):
              if event_name == "pull_request":
                  pr = payload["pull_request"]
                  return require_sha(pr["base"]["sha"]), require_sha(pr["head"]["sha"]), "selective"
              if event_name == "push" and payload["after"] == head:
                  return require_sha(payload["before"]), None, "selective"
              if event_name == "workflow_dispatch":
                  inputs = payload["inputs"]
                  if inputs["mode"] in {"full", "selective"}:
                      return require_sha(inputs["base_sha"]), None, inputs["mode"]
              raise ValueError("Unrecognized CI event or inconsistent commit metadata")


          def ensure_base(base):
              exists = subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], cwd=ROOT, stderr=subprocess.DEVNULL)
              if exists.returncode:
                  git("fetch", "--no-tags", "--depth=1", "origin", base)
              git("cat-file", "-e", f"{base}^{{commit}}")


          def changed_paths(base, head, pr_head=None, *, allow_initial_push=False):
              if pr_head and git("show", "-s", "--format=%P", head).decode().split() != [base, pr_head]:
                  raise ValueError("PR merge commit does not match event base and head")
              if base == "0" * 40 and allow_initial_push:
                  return decode_paths(git("ls-tree", "-rz", "--name-only", head))
              ensure_base(base)
              return decode_paths(git("diff", "--name-only", "-z", "--no-renames", "--ignore-submodules=none", base, head, "--"))


          def decode_paths(output):
              return [os.fsdecode(path) for path in output.split(b"\0") if path]


          def write_result(mode, selected, paths, base, head):
              active = selected.copy()
              if mode == "full":
                  active.update(CHECKS)
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  for check in sorted(CHECKS):
                      print(f"{check}={str(check in active).lower()}", file=output)
              needed = ", ".join(sorted(selected)) or "none"
              executed = ", ".join(sorted(active)) or "none"
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  print(f"### CI paths\n\n- Mode: `{mode}`\n- Range: `{base}` → `{head}`", file=summary)
                  print(f"- Changed paths: {len(paths)}\n- Selected: {needed}\n- Run: {executed}", file=summary)



          base = require_sha(os.environ['BENCHMARK_BASE'])
          head = require_sha(os.environ['BENCHMARK_SHA'])
          pr_head = require_sha(os.environ['BENCHMARK_PR_HEAD'])
          paths = changed_paths(base, head, pr_head)
          rules = json.loads('{\n  "rules": [\n    {\n      "run": "both",\n      "paths": [\n        ".gitattributes",\n        ".github/ci-paths.json",\n        ".github/workflows/ci.yml",\n        "scripts/ci/**"\n      ]\n    },\n    {\n      "run": "none",\n      "paths": [\n        ".env.example",\n        ".github/ISSUE_TEMPLATE/**",\n        ".github/pull_request_template.md",\n        ".github/workflows/slack-notification.yml",\n        ".gitmodules",\n        ".husky/**",\n        "AGENTS.md",\n        "CLAUDE.md",\n        "README.md",\n        "backend/AGENTS.md",\n        "backend/README.md",\n        "backend/docs/**.md",\n        "buildspec.yml",\n        "commitlint.config.cjs",\n        "compose.yaml",\n        "config",\n        "config-version.txt",\n        "design/**",\n        "docs/**",\n        "evidence.md",\n        "ops/backup/**",\n        "ops/configure/**",\n        "ops/diagnose/**",\n        "ops/loadtest/**",\n        "ops/monitor/app.sh",\n        "ops/monitor/cloudwatch/install_database.sh",\n        "ops/monitor/cloudwatch/systemd/**",\n        "ops/monitor/database.sh",\n        "ops/pdf-extraction-lambda/**",\n        "ops/recover/**",\n        "output/pdf/**",\n        "scripts/config/compare-env-keys.sh",\n        "scripts/config/sync.sh",\n        "scripts/config/tests/compare_env_keys_test.sh",\n        "scripts/config/validate-pin.sh",\n        "scripts/run-checkstyle.mjs"\n      ]\n    },\n    {\n      "run": "frontend",\n      "paths": [".gitignore", ".nvmrc", "frontend/**", "package-lock.json", "package.json"]\n    },\n    {\n      "run": "backend",\n      "paths": [\n        "backend/**",\n        "ops/monitor/cloudwatch/database_metrics.py",\n        "ops/monitor/cloudwatch/queries.json",\n        "ops/monitor/cloudwatch/tests/**",\n        "ops/monitor/cloudwatch/update_dashboards.py",\n        "scripts/config/tests/deploy_env_test.sh",\n        "scripts/config/verify-build-source.sh"\n      ]\n    }\n  ]\n}\n')['rules']
          selected = classify(paths, rules)
          print('selected=' + ','.join(sorted(selected)))
          write_result('selective', selected, paths, base, head)
          PY_SELECTOR

      - name: Check Flyway migration order
        if: steps.changes.outputs.backend == 'true'
        run: sh deploy/scripts/check_flyway_migration_order.sh "$BENCHMARK_BASE"

      - name: Check Flyway contract changes
        if: steps.changes.outputs.backend == 'true'
        run: sh deploy/scripts/check_flyway_contract_changes.sh "$BENCHMARK_BASE"

      - name: Set up Java
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.changes.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build backend
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew build --no-daemon

      - name: Test deployment scripts
        if: steps.changes.outputs.backend == 'true'
        run: |
          sh deploy/tests/check_flyway_migration_order_test.sh
          sh deploy/tests/check_flyway_contract_changes_test.sh
          sh deploy/tests/validate_service_test.sh
          sh deploy/tests/cleanup_releases_test.sh
          sh deploy/tests/install_env_test.sh
          sh deploy/tests/after_install_monitoring_test.sh
          sh ../scripts/config/tests/deploy_env_test.sh
          python3 -m unittest discover -s ../ops/monitor/cloudwatch/tests -v
